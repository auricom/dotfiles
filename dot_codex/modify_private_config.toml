#!/usr/bin/env python3
import copy
import re
import sys
import tomllib

content = sys.stdin.read()
original = tomllib.loads(content)
expected = copy.deepcopy(original)
expected.setdefault("tui", {})["theme"] = "catppuccin-system"
if original == expected:
    sys.stdout.write(content)
    sys.exit(0)

setting = 'theme = "catppuccin-system"\n'
header = re.search(r"(?m)^[ \t]*\[tui\][ \t]*(?:#[^\n]*)?(?:\n|$)", content)
if header:
    next_table = re.search(r"(?m)^[ \t]*\[", content[header.end():])
    end = header.end() + next_table.start() if next_table else len(content)
    section = re.sub(r'(?m)^[ \t]*(?:theme|"theme")[ \t]*=[^\n]*(?:\n|$)', "", content[header.end():end])
    content = content[:header.end()].rstrip("\n") + "\n" + setting + section + content[end:]
else:
    content = content.rstrip("\n") + "\n\n[tui]\n" + setting

# Refuse to write if a nonstandard TOML layout changed anything besides the theme.
if tomllib.loads(content) != expected:
    sys.exit("Cannot safely update the Codex theme in this TOML layout")
sys.stdout.write(content)
